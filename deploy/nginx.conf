map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /healthz {
        access_log off;
        return 200 'ok';
    }
    location = /create { return 302 /create/; }
    location /create/ {
        try_files /account-info.html =404;
    }
    location /world/login/ {
        proxy_pass http://login:6111/;
        include /etc/nginx/proxy_params_local;
    }
    location /world/blizzard/ {
        proxy_pass http://world:6112/;
        include /etc/nginx/proxy_params_local;
    }
}

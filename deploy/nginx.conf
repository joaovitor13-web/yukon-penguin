map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=registration:1m rate=6r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /healthz {
        access_log off;
        return 200 'ok';
    }
    location = /create { return 302 /create/; }
    location /create/img/ {
        try_files $uri =404;
    }
    location /create/ {
        try_files /account-info.html =404;
    }
    location = /api/accounts {
        client_max_body_size 4k;
        limit_req zone=registration burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://registration:6113;
        include /etc/nginx/proxy_params_local;
    }
    location /world/login/ {
        proxy_pass http://login:6111/;
        include /etc/nginx/proxy_params_local;
    }
    location /world/blizzard/ {
        proxy_pass http://world:6112/;
        include /etc/nginx/proxy_params_local;
    }
}
